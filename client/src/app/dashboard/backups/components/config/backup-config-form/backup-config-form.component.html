<div class="form-container">
  <form (ngSubmit)="save()" [formGroup]="configForm" class="form">
    <gl-input
      formControlName="name"
      [label]="'dashboard.backups.modal.add.form.name' | translate"
    />
    <gl-input
      formControlName="frequency"
      [label]="'dashboard.backups.modal.add.form.frequency' | translate"
    />
    <gl-checkbox
      formControlName="enabled"
      [label]="'dashboard.backups.modal.add.form.enabled' | translate"
    />
    <gl-input
      formControlName="to_keep"
      [label]="'dashboard.backups.modal.add.form.to_keep' | translate"
    />

    <div class="submit">
      @if (modalConfig.data?.config === undefined) {
        <gl-button>{{
          'dashboard.backups.modal.add.form.submit' | translate
        }}</gl-button>
      }
      @if (modalConfig.data?.config !== undefined) {
        <gl-button>{{
          'dashboard.backups.modal.edit.form.submit' | translate
        }}</gl-button>
      }
    </div>
  </form>
</div>
